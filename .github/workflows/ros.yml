# https://github.com/ros-tooling/setup-ros
name: ros
on: [push, workflow_dispatch, pull_request]
jobs:
    ros:
      runs-on: ${{ matrix.os }}
      strategy:
        matrix:
          os: ['ubuntu-24.04', 'ubuntu-24.04-arm']
      container:
        image: murilomarinho/sas:jazzy
      steps:
        - name: Checkout repository
          uses: actions/checkout@v5
        - name: Build colcon
          shell: bash
          run: |
            source /opt/ros/jazzy/setup.bash
            colcon build
    typecheck:
      runs-on: ubuntu-24.04
      steps:
        - name: Checkout repository
          uses: actions/checkout@v5
        - name: Set up Node
          uses: actions/setup-node@v5
          with:
            node-version: '22'
        - name: pyright (example code is fully annotated)
          run: npx --yes pyright -p ros2_tutorial_workspace
